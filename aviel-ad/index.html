<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Event Concierge</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <!-- הקישור של הקידום הממומן של אביאל (2026-10-31). נפרד מ-/aviel כדי שהליד יירשם
         "מקור: aviel_ad" ולא יתערבב עם הפוסט האורגני. fbclid שמטא מוסיפה עובר הלאה,
         כדי שהפיקסל ישייך את הכניסה למודעה. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        q.set('utm_source', 'aviel_ad'); q.set('utm_medium', 'paid_social'); q.set('utm_campaign', 'collab-video-boost');
        location.replace('/?' + q.toString() + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/?utm_source=aviel_ad&utm_medium=paid_social&utm_campaign=collab-video-boost"></noscript>
</head>
<body style="background:#0f1a14;color:#c89b6f;font-family:Arial,sans-serif;text-align:center;padding-top:40vh">
    <a href="/?utm_source=aviel_ad&utm_medium=paid_social&utm_campaign=collab-video-boost" style="color:inherit">Event Concierge ›</a>
</body>
</html>
